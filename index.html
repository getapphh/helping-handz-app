<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#168a45">
  <title>Helping Handz</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#168a45;color:#fff;min-height:100vh;display:grid;place-items:center}
    main{max-width:420px;text-align:center;padding:32px}
    img{width:150px;height:150px;border-radius:28px}
    h1{font-size:34px;margin:18px 0 8px}
    p{line-height:1.45}
    button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:16px;margin:12px 0;font-size:18px;font-weight:700;background:#fff;color:#126d39;text-decoration:none}
    .small{font-size:14px;opacity:.9}
    #iosHelp{display:none;background:rgba(0,0,0,.16);padding:14px;border-radius:14px;margin-top:14px}
  </style>
</head>
<body>
<main>
  <img src="./icon-192.png" alt="Helping Handz">
  <h1>Helping Handz</h1>
  <p>Install Helping Handz for quick access to booking and services.</p>
  <button id="installBtn" style="display:none">Install Helping Handz</button>
  <a class="btn" id="openBtn" href="https://helpinghandzonline.square.site/">Open Helping Handz</a>
  <div id="iosHelp">
    <strong>On iPhone:</strong><br>
    Tap the Share button in Safari, choose <b>Add to Home Screen</b>, then tap <b>Add</b>.
  </div>
  <p class="small">If you already installed Helping Handz, tap “Open Helping Handz.”</p>
</main>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');

let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !isStandalone) document.getElementById('iosHelp').style.display = 'block';

// When launched from the installed icon, send the customer to the existing Square site.
if (isStandalone) {
  setTimeout(() => location.href = 'https://helpinghandzonline.square.site/', 500);
}
</script>
</body>
</html>
